name: build-linux

# Builds an APRSWolf Linux .deb package (amd64) and uploads it.
#
# Trigger it one of these ways:
#   1. Manual:  GitHub repo → Actions → "Linux .deb build" → "Run workflow"
#   2. Push a version tag (e.g. v1.0.0): also creates/uses a GitHub Release
#      and attaches the .deb files to it.
#
# The resulting .deb is available as a downloadable workflow artifact.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Linux .deb (amd64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # Tauri v2 Linux build dependencies (Ubuntu 22.04/24.04 runner).
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build .deb (amd64)
        env:
          TAURI_TARGET: x86_64-unknown-linux-gnu
        run: npm run tauri build -- --bundles deb --target "$TAURI_TARGET"

      - name: Rename .deb to display-version form
        env:
          DEB_ARCH: amd64
          TAURI_TARGET: x86_64-unknown-linux-gnu
        run: |
          DEB=$(ls -t "src-tauri/target/$TAURI_TARGET/release/bundle/deb"/*.deb | head -1)
          DISPLAY_VERSION=$(node -e '
            const p = require("./package.json");
            const v = p.displayVersion || p.version;
            const m = String(v).match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (m) process.stdout.write(`${Number(m[1])}.${Number(m[2])}`);
            else process.stdout.write(String(v).replace(/\b\d+\b/g, (s) => String(Number(s))));
          ')
          FINAL="APRSWolf_${DISPLAY_VERSION}_${DEB_ARCH}.deb"
          echo "Origin: $DEB"
          echo "Final:  $FINAL"
          mkdir -p dist-linux
          cp "$DEB" "dist-linux/$FINAL"
          echo "deb_name=$FINAL" >> "$GITHUB_ENV"
          echo "deb_path=dist-linux/$FINAL" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: APRSWolf-linux-amd64
          path: dist-linux/*.deb
          if-no-files-found: error

      # Only attach to a GitHub Release when built from a tag (e.g. v1.0.0).
      - name: Attach .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.deb_path }}
          generate_release_notes: true
