name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Tauri v2 Linux build dependencies. `cargo test`/`cargo clippy` compile
      # the whole crate, including the GTK/WebKit bindings, so the -sys crates
      # (glib-sys, gtk-sys, webkit2gtk-sys, ...) need their system headers.
      # Without these the build fails with "failed to run custom build command
      # for `glib-sys`". Keep this list in sync with release.yml.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend deps
        run: npm ci

      # The full local gate: frontend tests, backend tests, tsc, clippy.
      # Run the same thing before pushing with: npm run verify
      - name: Verify
        run: npm run verify
