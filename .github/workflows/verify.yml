name: verify

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install frontend deps
        run: npm ci

      # The full local gate: frontend tests, backend tests, tsc, clippy.
      # Run the same thing before pushing with: npm run verify
      - name: Verify
        run: npm run verify
