<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APRSWolf Remote</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ececec;
      --panel: rgba(255, 255, 255, 0.82);
      --list: rgba(255, 255, 255, 0.88);
      --line: rgba(60, 60, 67, 0.14);
      --text: #1d1d1f;
      --muted: #8e8e93;
      --input-bg: rgba(255, 255, 255, 0.95);
      --btn: #007aff;
      --btn-hover: #0066dd;
      --sent-bg: rgba(111, 62, 160, 0.05);
      --sent-addr: #6e3ea0;
      --recv-bg: rgba(34, 111, 90, 0.07);
      --recv-hover: rgba(34, 111, 90, 0.14);
      --recv-addr: #226f5a;
      --warn: #b25000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15181d;
        --panel: rgba(34, 39, 47, 0.9);
        --list: rgba(28, 32, 39, 0.95);
        --line: rgba(132, 145, 165, 0.35);
        --text: #e4e6eb;
        --muted: #9aa3b2;
        --input-bg: #12161d;
        --btn: #2f87ff;
        --btn-hover: #3a90ff;
        --sent-bg: rgba(111, 62, 160, 0.18);
        --sent-addr: #b48cf0;
        --recv-bg: rgba(34, 111, 90, 0.2);
        --recv-hover: rgba(34, 111, 90, 0.32);
        --recv-addr: #5fbf98;
        --warn: #ffb35c;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100vh;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
    }

    /* Header */
    .app-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .app-header h1 { font-size: 15px; margin: 0; }
    .app-version {
      font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--input-bg);
    }
    .header-status { flex: 1; text-align: center; font-weight: 600; min-width: 140px; }
    .header-clock { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--muted); font-size: 12px; }

    /* Send row */
    .send-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr auto; gap: 6px; align-items: end; }
    label { display: grid; gap: 2px; color: var(--muted); font-size: 11px; }
    input, select {
      width: 100%; border-radius: 6px; border: 1px solid var(--line);
      padding: 4px 6px; background: var(--input-bg); color: var(--text);
      min-height: 28px; font-size: 13px; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--btn); box-shadow: 0 0 0 2.5px rgba(0, 122, 255, 0.22); }
    .hint { font-size: 11px; color: var(--muted); margin: 4px 0 0; min-height: 1.2em; }
    .hint.warn { color: var(--warn); }
    button {
      border: 1px solid transparent; border-radius: 6px; padding: 0 12px; min-height: 28px;
      cursor: pointer; font-weight: 600; font-size: 12px; font-family: inherit;
      background: var(--btn); color: #fff;
    }
    button:hover:not(:disabled) { background: var(--btn-hover); }
    button.secondary { background: transparent; color: var(--text); border-color: var(--line); }
    button.secondary:hover:not(:disabled) { background: var(--recv-hover); }
    button:disabled { opacity: 0.45; cursor: default; }

    /* Message panes */
    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; min-height: 0; }
    .msg-pane { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .msg-pane h2 { font-size: 13px; margin: 0; }
    .chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .chip {
      min-height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 500;
      background: transparent; color: var(--text); border: 1px solid var(--line);
    }
    .chip.active { background: var(--btn); color: #fff; border-color: var(--btn); }
    .chip:hover:not(.active) { background: var(--recv-hover); }
    .msg-list {
      border: 1px solid var(--line); border-radius: 8px; background: var(--list);
      padding: 6px; display: flex; flex-direction: column; gap: 4px;
      overflow-y: auto; height: 55vh; min-height: 200px;
    }
    .msg-item {
      display: block; width: 100%; text-align: left; padding: 5px 6px; border-radius: 5px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 14px; line-height: 1.35;
      color: var(--text); border: 0; min-height: 0; font-weight: 400;
      /* The list scrolls; without this a full list squeezes its items and
         wrapped lines run into the next message. */
      flex-shrink: 0;
    }
    .sent-item { background: var(--sent-bg); }
    .recv-item { background: var(--recv-bg); cursor: pointer; }
    .recv-item:hover:not(:disabled) { background: var(--recv-hover); }
    .msg-top { display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .msg-time { color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    .msg-addr { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .sent-item .msg-addr { color: var(--sent-addr); }
    .recv-item .msg-addr { color: var(--recv-addr); }
    .msg-body { white-space: pre-wrap; word-break: break-word; }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 10px; padding: 1px 4px; border-radius: 3px; font-weight: 700;
      text-transform: uppercase; white-space: nowrap; flex-shrink: 0;
    }
    .badge.type { background: rgba(0, 122, 255, 0.12); color: var(--btn); }
    .badge.status { margin-left: auto; }
    .badge.queued, .badge.sent { background: rgba(53, 87, 160, 0.14); color: #4a6fa5; }
    .badge.acked { background: rgba(52, 199, 89, 0.15); color: #1f9d4b; }
    .badge.failed { background: rgba(255, 59, 48, 0.12); color: #e0453a; }
    .badge.expired { background: rgba(178, 120, 35, 0.14); color: #b2782d; }
    .empty { color: var(--muted); padding: 6px; margin: 0; }

    /* Bottom bar */
    .config-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .config-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .config-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .config-title { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
    .config-meta { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .config-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #ff453a; box-shadow: 0 0 0 1px rgba(176, 30, 24, 0.45); }
    .dot.on { background: #30d158; box-shadow: 0 0 0 1px rgba(36, 138, 61, 0.5); }

    /* Settings and activity */
    details > summary { cursor: pointer; font-weight: 600; font-size: 12px; }
    .settings-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; margin-top: 8px; }
    .settings-grid h3 { grid-column: 1 / -1; font-size: 11px; margin: 6px 0 0; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .settings-grid .wide { grid-column: span 2; }
    .settings-actions { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .log { max-height: 240px; overflow-y: auto; font-size: 12px; margin-top: 6px; }
    .log-entry { padding: 3px 6px; border-left: 3px solid var(--line); margin: 2px 0; }
    .log-entry.tx { border-left-color: #16a34a; }
    .log-entry.error { border-left-color: #dc2626; }
    .log-time { color: var(--muted); font-size: 11px; margin-right: 6px; }

    @media (max-width: 760px) {
      .panes { grid-template-columns: 1fr; }
      .msg-list { height: 40vh; }
      .config-bar { grid-template-columns: 1fr 1fr; }
      .settings-grid { grid-template-columns: 1fr 1fr; }
    }
    /* iOS Safari zooms the page when a focused field's text is under 16px. */
    @media (max-width: 760px), (pointer: coarse) {
      input, select { font-size: 16px; }
    }
    @media (max-width: 420px) {
      .send-row { grid-template-columns: 1fr auto; }
      .send-row .send-message { grid-column: 1 / -1; grid-row: 2; }
      .send-row button { grid-column: 2; grid-row: 1; align-self: end; }
      .config-bar, .settings-grid { grid-template-columns: 1fr; }
      .settings-grid .wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="panel app-header">
    <h1>APRSWolf</h1>
    <span class="app-version" id="appVersion"></span>
    <span class="header-status" id="headerStatus">Connecting to APRSWolf...</span>
    <span class="header-clock" id="clock"></span>
  </header>

  <section class="panel">
    <div class="send-row">
      <label>Message To <input id="destination" autocomplete="off" placeholder="WXYO" /></label>
      <label class="send-message">Message <input id="message" maxlength="67" autocomplete="off" placeholder="Test message" /></label>
      <button id="sendMessageBtn">Send</button>
    </div>
    <p class="hint" id="feedback"></p>
  </section>

  <main class="panes">
    <section class="panel msg-pane">
      <h2>Sent Messages</h2>
      <div class="msg-list" id="sentList"></div>
    </section>
    <section class="panel msg-pane">
      <h2>Received Messages</h2>
      <div class="chips" id="filterChips" role="group" aria-label="Filter received messages"></div>
      <div class="msg-list" id="receivedList"></div>
    </section>
  </main>

  <section class="panel config-bar">
    <div class="config-group">
      <div class="config-head"><span class="dot" id="stationDot"></span><span class="config-title">Station</span><span class="config-meta" id="stationMeta"></span></div>
      <div class="config-buttons">
        <button id="sendBeaconBtn">Beacon</button>
        <span class="config-meta" id="beaconCooldown"></span>
      </div>
    </div>
    <div class="config-group">
      <div class="config-head"><span class="dot" id="tncDot"></span><span class="config-title">TNC</span><span class="config-meta" id="tncMeta"></span></div>
      <div class="config-buttons">
        <button id="connectTncBtn">Connect TNC</button>
        <button class="secondary" id="disconnectTncBtn">Disconnect</button>
        <button class="secondary" id="clearQueueBtn">Clear Q</button>
      </div>
    </div>
    <div class="config-group">
      <div class="config-head"><span class="dot" id="aprsisDot"></span><span class="config-title">APRS-IS</span><span class="config-meta" id="aprsisMeta"></span></div>
      <div class="config-buttons">
        <button id="connectAprsIsBtn">Connect APRS-IS</button>
        <button class="secondary" id="disconnectAprsIsBtn">Disconnect</button>
      </div>
    </div>
    <div class="config-group">
      <div class="config-head"><span class="dot on"></span><span class="config-title">Remote</span><span class="config-meta" id="remoteMeta"></span></div>
      <div class="config-buttons">
        <button class="secondary" id="disableRemoteBtn">Disable Remote</button>
      </div>
      <input id="remoteToken" type="password" autocomplete="off" placeholder="Remote token (needed from other devices)" aria-label="Remote token" />
    </div>
  </section>

  <details class="panel">
    <summary>Settings</summary>
    <div class="settings-grid">
      <h3>Station</h3>
      <label>Callsign <input id="source" autocomplete="off" /></label>
      <label>Digi Path <input id="path" autocomplete="off" /></label>
      <label>Beacon Lat <input id="beaconLat" inputmode="decimal" /></label>
      <label>Beacon Lon <input id="beaconLon" inputmode="decimal" /></label>
      <label>Symbol <input id="beaconSymbol" maxlength="2" /></label>
      <h3>TNC</h3>
      <label class="wide">Host <input id="host" autocomplete="off" /></label>
      <label>KISS Port <input id="port" inputmode="numeric" /></label>
      <h3>APRS-IS</h3>
      <label class="wide">Server <input id="aprsisHost" autocomplete="off" /></label>
      <label>Port <input id="aprsisPort" inputmode="numeric" /></label>
      <label>Passcode <input id="aprsisPasscode" autocomplete="off" /></label>
      <label class="wide">Filter <input id="aprsisFilter" autocomplete="off" placeholder="Optional, e.g. m/50 or r/42.36/-71.06/25" /></label>
    </div>
    <div class="settings-actions">
      <button id="saveSettingsBtn">Save</button>
      <span class="hint" id="saveStatus"></span>
    </div>
    <p class="hint">TNC and APRS-IS are mutually exclusive. Direct APRS-IS sends ignore the RF path.</p>
  </details>

  <details class="panel">
    <summary>Activity</summary>
    <div class="log" id="activityList"></div>
  </details>

  <script>
    const $ = (id) => document.getElementById(id);
    const MAX_LOG = 80;
    const FILTERS = [
      ["all", "All"],
      ["tome", "To Me"],
      ["messages", "Messages"],
      ["bulletins", "Bulletins"],
    ];
    let entries = [];
    let lastState = null;
    let receivedFilter = "all";

    function escapeHtml(v) {
      return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    }

    function pushLog(kind, text) {
      entries = [{ at: new Date().toLocaleTimeString(), kind, text }, ...entries].slice(0, MAX_LOG);
      $("activityList").innerHTML = entries
        .map(e => `<div class="log-entry ${e.kind}"><span class="log-time">${escapeHtml(e.at)}</span>${escapeHtml(e.text)}</div>`)
        .join("");
    }

    // Settings fields edited since the last save. A snapshot leaves them
    // alone until Save, so new traffic can't overwrite an unsaved edit.
    const SETTINGS_FIELDS = ["source", "path", "beaconLat", "beaconLon", "beaconSymbol", "host", "port",
      "aprsisHost", "aprsisPort", "aprsisPasscode", "aprsisFilter"];
    const dirtyFields = new Set();

    function setValueIfIdle(id, v) {
      const el = $(id);
      if (el && document.activeElement !== el && !dirtyFields.has(id)) el.value = v ?? "";
    }

    // The feedback line shows an action's result, a refresh error, or the
    // "connect first" hint. A refresh error clears on the next good refresh,
    // and the hint never covers a message.
    let feedbackKind = "";
    let beaconReady = false;
    function setFeedback(msg, warn, kind = "action") {
      const el = $("feedback");
      el.textContent = msg || "";
      el.className = "hint" + (warn ? " warn" : "");
      feedbackKind = msg ? kind : "";
    }

    function setHint(text) {
      if (feedbackKind && feedbackKind !== "hint") return;
      setFeedback(text, false, "hint");
    }

    function connectHint(s) {
      return s.runtime.tnc_connected || s.runtime.aprsis_connected ? "" : "Connect TNC or APRS-IS to enable message sending.";
    }

    // Same algorithm as deriveAprsIsPasscode() in src/lib/helpers.ts.
    function derivePasscode(call) {
      const base = (call || "").trim().toUpperCase().split("-")[0];
      if (!base) return "";
      let h = 0x73e2;
      for (let i = 0; i < base.length; i += 2) {
        h ^= base.charCodeAt(i) << 8;
        if (i + 1 < base.length) h ^= base.charCodeAt(i + 1);
      }
      return String(h & 0x7fff);
    }

    function getToken() {
      try { return localStorage.getItem("aprswolf_remote_token") || ""; } catch { return ""; }
    }

    async function api(method, path, body) {
      const headers = { "Content-Type": "application/json" };
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(path, opts);
      if (r.status === 401) throw new Error("Unauthorized: enter the remote token in the Remote box");
      const data = r.status === 204 ? {} : await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }

    function formatTime(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      const time = d.toLocaleTimeString();
      return d.toDateString() === new Date().toDateString() ? time : `${d.toLocaleDateString()}, ${time}`;
    }

    // Same rules as matchesStationAddress() in src/lib/helpers.ts.
    function isToMe(item, source, allowBase) {
      const myCall = String(source || "").trim().toUpperCase();
      if (!myCall) return false;
      const myBase = myCall.split("-")[0];
      const to = String(item.to || "").trim().toUpperCase();
      if (to) return to === myCall || (allowBase && to.split("-")[0] === myBase);
      const body = String(item.body || "").toUpperCase();
      const named = (call) => new RegExp(`(?<![A-Z0-9])${call.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![A-Z0-9])`).test(body);
      return named(myCall) || (allowBase && named(myBase));
    }

    // Same test as isAckMessageBody() in src/lib/helpers.ts.
    function isAck(item) { return /^ack[A-Za-z0-9]{1,5}$/i.test(String(item.body || "").trim()); }

    function receivedList(s) {
      const all = Array.isArray(s.received) ? s.received : [];
      return s.settings.show_ack_messages ? all : all.filter(item => !isAck(item));
    }

    function matchesFilter(item, source) {
      switch (receivedFilter) {
        case "tome": return isToMe(item, source, Boolean(lastState?.settings?.promiscuous_base_callsign));
        case "messages": return item.aprsType === "msg";
        case "bulletins": return Boolean(item.isBulletin);
        default: return true;
      }
    }

    function renderChips(received, source) {
      $("filterChips").innerHTML = FILTERS.map(([key, label]) => {
        const prev = receivedFilter;
        receivedFilter = key;
        const count = received.filter(item => matchesFilter(item, source)).length;
        receivedFilter = prev;
        return `<button type="button" class="chip${key === receivedFilter ? " active" : ""}" data-filter="${key}">${label} ${count}</button>`;
      }).join("");
    }

    function renderSent(sent) {
      $("sentList").innerHTML = sent.length === 0
        ? '<p class="empty">No sent messages.</p>'
        : sent.map(item => `
          <div class="msg-item sent-item">
            <div class="msg-top">
              <span class="msg-time">${escapeHtml(formatTime(item.timestamp))}</span>
              <span class="msg-addr">&#9656; ${escapeHtml(item.destination)}</span>
              <span class="badge status ${escapeHtml(item.status)}">${escapeHtml(item.status)}</span>
            </div>
            <div class="msg-body">${escapeHtml(item.body)}</div>
          </div>`).join("");
    }

    function renderReceived(received, source) {
      const shown = received.filter(item => matchesFilter(item, source));
      $("receivedList").innerHTML = shown.length === 0
        ? '<p class="empty">No received messages for this filter.</p>'
        : shown.map(item => `
          <button type="button" class="msg-item recv-item" data-from="${escapeHtml(item.from)}">
            <span class="msg-top">
              <span class="msg-time">${escapeHtml(formatTime(item.timestamp))}</span>
              <span class="msg-addr">&#9666; ${escapeHtml(item.from)}</span>
              ${item.aprsType ? `<span class="badge type">${escapeHtml(item.aprsType)}</span>` : ""}
            </span>
            <span class="msg-body" style="display:block">${escapeHtml(item.body)}</span>
          </button>`).join("");
    }

    function render(s) {
      const source = s.settings.source;
      setValueIfIdle("source", source);
      setValueIfIdle("path", s.settings.path);
      setValueIfIdle("beaconLat", s.settings.beacon_lat);
      setValueIfIdle("beaconLon", s.settings.beacon_lon);
      setValueIfIdle("beaconSymbol", s.settings.beacon_symbol);
      setValueIfIdle("host", s.settings.host);
      setValueIfIdle("port", s.settings.port);
      setValueIfIdle("aprsisHost", s.settings.aprsis_host);
      setValueIfIdle("aprsisPort", s.settings.aprsis_port);
      setValueIfIdle("aprsisPasscode", s.settings.aprsis_passcode);
      setValueIfIdle("aprsisFilter", s.settings.aprsis_filter);
      $("appVersion").textContent = s.app_version ? `v${s.app_version}` : "";

      const tnc = s.runtime.tnc_connected;
      const aprsis = s.runtime.aprsis_connected;
      $("headerStatus").textContent = tnc ? "Connected to TNC" : aprsis ? "Connected to APRS-IS" : "Choose a transport and connect when ready.";
      $("stationDot").classList.toggle("on", tnc || aprsis);
      $("stationMeta").textContent = source || "no callsign";
      $("tncDot").classList.toggle("on", tnc);
      $("tncMeta").textContent = s.settings.host && s.settings.port ? `${s.settings.host}:${s.settings.port}` : "not set";
      $("aprsisDot").classList.toggle("on", aprsis);
      $("aprsisMeta").textContent = s.settings.aprsis_host ? `${s.settings.aprsis_host}:${s.settings.aprsis_port}` : "not set";
      $("remoteMeta").textContent = `port ${s.web_server.port}`;

      // Enabled under the same rules as the desktop's bottom bar (App.tsx),
      // read from the saved settings.
      const set = (v) => Boolean(String(v ?? "").trim());
      const st = s.settings;
      const tncConfigured = set(st.source) && set(st.host) && set(st.port);
      const aprsisConfigured = set(st.source) && set(st.aprsis_host) && set(st.aprsis_port) && set(st.aprsis_passcode);
      beaconReady = (tnc || aprsis) && set(st.beacon_lat) && set(st.beacon_lon) && set(st.beacon_symbol);
      $("connectTncBtn").disabled = !tncConfigured || tnc || aprsis;
      $("disconnectTncBtn").disabled = !tnc;
      $("connectAprsIsBtn").disabled = !aprsisConfigured || tnc || aprsis;
      $("disconnectAprsIsBtn").disabled = !aprsis;
      $("sendBeaconBtn").disabled = !beaconReady || Boolean(beaconCooldownTimer);
      $("sendMessageBtn").disabled = !(tnc || aprsis);
      setHint(connectHint(s));

      const received = receivedList(s);
      renderChips(received, source);
      renderReceived(received, source);
      renderSent(Array.isArray(s.sent) ? s.sent : []);

      if (s.manual_beacon_cooldown_remaining_sec > 0 && !beaconCooldownTimer) {
        startBeaconCooldown(s.manual_beacon_cooldown_remaining_sec);
      }
    }

    // One request at a time: a refresh asked for while one is in flight runs
    // right after it, so a slow reply can never draw over a newer one.
    let lastJson = "";
    let refreshing = false;
    let refreshAgain = false;
    let stopped = false;
    async function refresh() {
      if (stopped) return;
      if (refreshing) { refreshAgain = true; return; }
      refreshing = true;
      try {
        const state = await api("GET", "/api/state");
        if (stopped) return;
        const json = JSON.stringify(state);
        lastState = state;
        if (feedbackKind === "refresh") { setFeedback(""); setHint(connectHint(state)); }
        // Re-rendering an unchanged list every poll would reset taps in progress.
        if (json !== lastJson) render(state);
        lastJson = json;
      } catch (e) {
        if (!stopped) setFeedback(e.message || String(e), true, "refresh");
      } finally {
        refreshing = false;
        if (refreshAgain) { refreshAgain = false; refresh(); }
      }
    }

    let beaconCooldownTimer = null;
    function startBeaconCooldown(sec) {
      if (beaconCooldownTimer) clearInterval(beaconCooldownTimer);
      let left = sec;
      $("sendBeaconBtn").disabled = true;
      const tick = () => {
        if (left <= 0) {
          clearInterval(beaconCooldownTimer);
          beaconCooldownTimer = null;
          $("beaconCooldown").textContent = "";
          $("sendBeaconBtn").disabled = !beaconReady;
          return;
        }
        $("beaconCooldown").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
        left -= 1;
      };
      tick();
      beaconCooldownTimer = setInterval(tick, 1000);
    }

    function tickClock() {
      const now = new Date();
      const utc = `${String(now.getUTCHours()).padStart(2, "0")}:${String(now.getUTCMinutes()).padStart(2, "0")}Z`;
      const local = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false, timeZoneName: "short" });
      $("clock").textContent = `${utc} ${local}`;
    }

    async function action(path, body, ok) {
      try {
        await api("POST", path, body);
        setFeedback(ok);
        pushLog("status", ok);
        refresh();
      } catch (e) {
        setFeedback(e.message, true);
        pushLog("error", e.message);
      }
    }

    $("filterChips").addEventListener("click", (event) => {
      const chip = event.target.closest("[data-filter]");
      if (!chip || !lastState) return;
      receivedFilter = chip.dataset.filter;
      const received = receivedList(lastState);
      renderChips(received, lastState.settings.source);
      renderReceived(received, lastState.settings.source);
    });

    // Tap a received message to reply, as a click does on the desktop.
    $("receivedList").addEventListener("click", (event) => {
      const item = event.target.closest("[data-from]");
      if (!item) return;
      $("destination").value = item.dataset.from;
      $("message").focus();
    });

    $("sendMessageBtn").addEventListener("click", async () => {
      const dest = $("destination").value.trim();
      const msg = $("message").value.trim();
      if (!dest || !msg) { setFeedback("Fill in both Message To and Message.", true); return; }
      try {
        await api("POST", "/api/send-message", { destination: dest, text: msg });
        setFeedback(`Queued to ${dest}`);
        pushLog("tx", `Message to ${dest}: ${msg}`);
        $("message").value = "";
        refresh();
      } catch (e) { setFeedback(e.message, true); pushLog("error", e.message); }
    });
    $("message").addEventListener("keydown", (event) => {
      if (event.key === "Enter") $("sendMessageBtn").click();
    });

    $("sendBeaconBtn").addEventListener("click", () => action("/api/send-beacon", null, "Beacon sent"));
    $("connectTncBtn").addEventListener("click", () =>
      action("/api/tnc/connect", { host: $("host").value, port: parseInt($("port").value, 10) || 8001 }, "TNC connecting..."));
    $("disconnectTncBtn").addEventListener("click", () => action("/api/tnc/disconnect", null, "TNC disconnected"));
    $("clearQueueBtn").addEventListener("click", () => action("/api/tnc/clear-queue", null, "Queue cleared"));
    $("connectAprsIsBtn").addEventListener("click", () =>
      action("/api/aprsis/connect", {
        host: $("aprsisHost").value,
        port: parseInt($("aprsisPort").value, 10) || 14580,
        passcode: $("aprsisPasscode").value,
        filter: $("aprsisFilter").value,
      }, "APRS-IS connecting..."));
    $("disconnectAprsIsBtn").addEventListener("click", () => action("/api/aprsis/disconnect", null, "APRS-IS disconnected"));

    $("disableRemoteBtn").addEventListener("click", async () => {
      try {
        await api("POST", "/api/disable");
        stopped = true;
        clearInterval(clockTimer);
        clearInterval(refreshTimer);
        if (beaconCooldownTimer) clearInterval(beaconCooldownTimer);
        document.body.innerHTML = '<section class="panel" style="margin-top:40px;text-align:center"><h1 style="font-size:15px">Remote Disabled</h1><p class="hint">Re-enable from the APRSWolf desktop app.</p></section>';
      } catch (e) { setFeedback(e.message, true); }
    });

    $("saveSettingsBtn").addEventListener("click", async () => {
      try {
        await api("POST", "/api/save-settings", {
          callsign: $("source").value,
          path: $("path").value,
          beacon_latitude: $("beaconLat").value,
          beacon_longitude: $("beaconLon").value,
          beacon_symbol: $("beaconSymbol").value,
          tnc_host: $("host").value,
          tnc_port: parseInt($("port").value, 10) || 8001,
          aprsis_host: $("aprsisHost").value,
          aprsis_port: parseInt($("aprsisPort").value, 10) || 14580,
          aprsis_passcode: $("aprsisPasscode").value,
          aprsis_filter: $("aprsisFilter").value,
        });
        dirtyFields.clear();
        $("saveStatus").textContent = "Saved";
        pushLog("status", "Settings saved");
        refresh();
      } catch (e) { $("saveStatus").textContent = "Error: " + (e.message || ""); }
    });

    ["source", "destination"].forEach(id => {
      $(id).addEventListener("input", () => { $(id).value = $(id).value.toUpperCase(); });
    });
    SETTINGS_FIELDS.forEach(id => {
      $(id).addEventListener("input", () => dirtyFields.add(id));
    });
    $("source").addEventListener("change", () => {
      $("aprsisPasscode").value = derivePasscode($("source").value);
      dirtyFields.add("aprsisPasscode");
    });

    $("remoteToken").value = getToken();
    // Wait for a pause in typing, so a half-typed token doesn't fire a
    // refused request per keystroke.
    let tokenTimer = null;
    $("remoteToken").addEventListener("input", () => {
      try { localStorage.setItem("aprswolf_remote_token", $("remoteToken").value.trim()); } catch {}
      clearTimeout(tokenTimer);
      tokenTimer = setTimeout(refresh, 500);
    });

    tickClock();
    const clockTimer = setInterval(tickClock, 1000);
    refresh();
    const refreshTimer = setInterval(refresh, 3000);
  </script>
</body>
</html>
